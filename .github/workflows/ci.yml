name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The eval needs the real embedding model (~130MB). Cache it across
      # runs so the gate costs seconds, not a download, on every PR.
      - name: Pin the embedding model cache
        run: echo "FASTEMBED_CACHE_PATH=$HOME/.cache/fastembed" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - run: make setup PY_BOOT=python3
      - run: make lint
      - run: make test
      - name: Retrieval eval gate
        run: make eval
